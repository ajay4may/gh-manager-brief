<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Offsite Brief">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b1f3b"/>
      <stop offset="0.55" stop-color="#3b2a5a"/>
      <stop offset="1" stop-color="#8a1f24"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8526a"/>
      <stop offset="1" stop-color="#a4262c"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- rounded app-tile background -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- brief / document card -->
  <g filter="url(#sh)">
    <rect x="150" y="120" width="212" height="272" rx="24" fill="#fcfbf8"/>
    <!-- accent header band -->
    <path d="M150 144 a24 24 0 0 1 24 -24 h164 a24 24 0 0 1 24 24 v36 h-212 z" fill="url(#accent)"/>
    <!-- text lines -->
    <rect x="178" y="210" width="156" height="14" rx="7" fill="#d9d4cd"/>
    <rect x="178" y="242" width="156" height="14" rx="7" fill="#d9d4cd"/>
    <rect x="178" y="274" width="104" height="14" rx="7" fill="#d9d4cd"/>
  </g>

  <!-- send / paper-plane badge (the "send to manager" action) -->
  <g filter="url(#sh)">
    <circle cx="346" cy="346" r="62" fill="url(#accent)"/>
    <path d="M318 346 l60 -24 -24 60 -10 -22 -26 -14 z" fill="#fff"/>
    <path d="M354 322 l-20 38" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  </g>
</svg>
